version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: elemnt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elemnt_rentals
      POSTGRES_USER: elemnt_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    # SEC-021-02: Port 5432 intentionally NOT mapped to host.
    # The backend accesses Postgres via the internal elemnt_network.
    # Use: docker exec -it elemnt_postgres psql -U elemnt_user -d elemnt_rentals
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U elemnt_user -d elemnt_rentals" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elemnt_network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elemnt_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://elemnt_user:${DB_PASSWORD}@postgres:5432/elemnt_rentals
      SECRET_KEY: ${SECRET_KEY}
      NOTIFICATIONS_WEBHOOK_URL: ${NOTIFICATIONS_WEBHOOK_URL}
    volumes:
      # SEC-021-04: Only persist uploads. Source bind-mount removed (was dev-only).
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - elemnt_network
    # SEC-021-04: No command override — Dockerfile CMD is used (production uvicorn, no --reload).

    # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: elemnt_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    networks:
      - elemnt_network

volumes:
  postgres_data:
    driver: local

networks:
  elemnt_network:
    driver: bridge
